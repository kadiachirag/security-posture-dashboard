<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Posture Dashboard - Entra ID, Azure, Defender, AI &amp; Agents</title>
  <style>
    :root {
      /* Surfaces: a light mesh-gradient page with frosted glass panels on top */
      --bg: #eef2f9;
      --bg-mesh:
        radial-gradient(900px 600px at 8% -10%, rgba(42, 120, 214, 0.22), transparent 60%),
        radial-gradient(800px 560px at 100% 0%, rgba(124, 58, 237, 0.18), transparent 60%),
        radial-gradient(700px 520px at 90% 90%, rgba(27, 175, 122, 0.16), transparent 60%),
        radial-gradient(760px 520px at 0% 100%, rgba(235, 104, 52, 0.14), transparent 60%),
        linear-gradient(180deg, #f4f7fc 0%, #eef2f9 100%);
      --panel: rgba(255, 255, 255, 0.68);
      --panel-strong: rgba(255, 255, 255, 0.86);
      --panel-solid: #ffffff;
      --glass-border: rgba(255, 255, 255, 0.75);
      --glass-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 14px 40px -14px rgba(30, 41, 59, 0.20);
      --glass-shadow-hover: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 22px 48px -16px rgba(30, 41, 59, 0.28);
      --radius: 1.1rem;
      --radius-sm: 0.7rem;
      --text: #1f2937;
      --muted: #6b7280;
      --grid: #e1e0d9;
      --border: rgba(31, 41, 55, 0.10);
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-gradient: linear-gradient(120deg, #2563eb 0%, #7c3aed 100%);
      --hover: rgba(37, 99, 235, 0.06);
      /* Domain colors: categorical, fixed order [blue, orange, aqua, violet], never reassigned on filter.
         Violet is palette slot 7; slot 4 yellow was rejected because it sits next to --warn on every card. */
      --entra: #2a78d6;
      --azure: #eb6834;
      --defender: #1baf7a;
      --ai: #4a3aa7;
      /* Severity / status colors: reserved, always paired with text */
      --sev-critical: #d03b3b;
      --sev-high: #ec835a;
      --sev-medium: #fab219;
      --sev-low: #898781;
      --pass: #0ca30c;
      --warn: #fab219;
      --fail: #d03b3b;
      --pass-text: #006300;
      --seq-1: #cde2fb;
      --seq-2: #86b6ef;
      --seq-3: #3987e5;
      --seq-4: #1c5cab;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }
    body {
      margin: 0;
      padding: 1.25rem;
      min-height: 100vh;
      background: var(--bg-mesh);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    /* faint dot grid over the mesh for texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(rgba(31, 41, 55, 0.07) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.35));
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.35));
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    select, input { font: inherit; color: inherit; }
    h1, h2, h3, h4 { margin: 0; font-weight: 600; }
    /* Shared frosted glass surface */
    .glass, .topbar, .filters, .card, .drawer {
      background: var(--panel);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Header ---------- */
    .topbar {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .topbar::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 6px;
      background: var(--accent-gradient);
    }
    .topbar h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(120deg, #111827 0%, #2563eb 55%, #7c3aed 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }
    .topbar .meta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
    .badge {
      display: inline-block;
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(37, 99, 235, 0.18);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .hero {
      margin-left: auto;
      text-align: right;
      padding: 0.75rem 1.1rem;
      border-radius: var(--radius-sm);
      background: var(--panel-strong);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px -14px rgba(37, 99, 235, 0.35);
    }
    .hero .label { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
    .hero .num {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }
    .hero .num small {
      font-size: 1.1rem;
      font-weight: 500;
      background: none;
      -webkit-text-fill-color: var(--muted);
      color: var(--muted);
    }

    /* ---------- Tabs: floating pill segmented control ---------- */
    .tabs {
      display: inline-flex;
      gap: 0.2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      padding: 0.3rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px -14px rgba(30, 41, 59, 0.25);
    }
    .tabs button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .tabs button:hover { color: var(--text); background: rgba(255, 255, 255, 0.7); }
    .tabs button[aria-selected="true"] {
      color: #fff;
      background: var(--accent-gradient);
      box-shadow: 0 8px 18px -8px rgba(37, 99, 235, 0.6);
    }
    .tabs button:focus-visible, .chip:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Filters ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      border-radius: var(--radius);
      padding: 0.8rem 1.1rem;
      margin-bottom: 1rem;
    }
    .filters label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: var(--muted); }
    .filters select, .filters input {
      padding: 0.4rem 0.6rem;
      border: 1px solid rgba(31, 41, 55, 0.12);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .filters select:focus-visible, .filters input:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .filters input[type="search"] { min-width: 12rem; }
    .chips { display: flex; gap: 0.3rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.32rem 0.65rem;
      border: 1px solid rgba(31, 41, 55, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      color: var(--muted);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-pressed="true"] { border-color: transparent; color: var(--text); background: var(--accent-soft); box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25) inset; }
    .chip .dot { width: 8px; height: 8px; }
    .filters .count { margin-left: auto; font-size: 0.85rem; color: var(--muted); }
    .btn-ghost { padding: 0.4rem 0.8rem; border: 1px solid rgba(31, 41, 55, 0.12); border-radius: var(--radius-sm); background: rgba(255, 255, 255, 0.85); font-size: 0.85rem; transition: background 0.15s, border-color 0.15s; }
    .btn-ghost:hover { background: var(--accent-soft); border-color: var(--accent); }

    /* ---------- Layout ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .grid.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .card {
      position: relative;
      border-radius: var(--radius);
      padding: 1.1rem 1.2rem;
      min-width: 0;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card.span-2 { grid-column: span 2; }
    @media (max-width: 700px) { .card.span-2 { grid-column: span 1; } }
    .card h3 { font-size: 0.95rem; margin-bottom: 0.6rem; letter-spacing: -0.005em; }
    .card h3 .sub { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-top: 0.1rem; }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { box-shadow: var(--glass-shadow-hover); transform: translateY(-2px); }
    .card.clickable:focus-visible { outline: none; box-shadow: var(--glass-shadow), 0 0 0 2px var(--accent); }
    /* Domain cards: gradient accent bar tucked under the rounded top edge */
    .card.domain-entra, .card.domain-azure, .card.domain-defender, .card.domain-ai { overflow: hidden; }
    .card.domain-entra::before, .card.domain-azure::before, .card.domain-defender::before, .card.domain-ai::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 5px;
      background: var(--domain-color, var(--accent));
      opacity: 0.9;
    }
    .card.domain-entra { --domain-color: var(--entra); }
    .card.domain-azure { --domain-color: var(--azure); }
    .card.domain-defender { --domain-color: var(--defender); }
    .card.domain-ai { --domain-color: var(--ai); }
    .note { font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0 0; }

    /* ---------- KPI tiles ---------- */
    .kpi .label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.01em; }
    .kpi .value { font-size: 1.9rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
    .kpi .value small { font-size: 0.95rem; font-weight: 500; color: var(--muted); }
    .kpi .delta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .kpi .delta.bad { color: var(--fail); }
    .kpi .delta.good { color: var(--pass-text); }

    .counts { display: flex; gap: 1rem; margin: 0.4rem 0 0.6rem; }
    .counts div { display: flex; flex-direction: column; }
    .counts span:first-child { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .counts span:last-child { font-size: 1.3rem; font-weight: 700; }

    /* ---------- Marks ---------- */
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 0.35rem; flex: none; }
    .dot.critical { background: var(--sev-critical); }
    .dot.high { background: var(--sev-high); }
    .dot.medium { background: var(--sev-medium); }
    .dot.low { background: var(--sev-low); }
    .dot.fail { background: var(--fail); }
    .dot.warn { background: var(--warn); }
    .dot.pass { background: var(--pass); }
    .dot.entra { background: var(--entra); }
    .dot.azure { background: var(--azure); }
    .dot.defender { background: var(--defender); }
    .dot.ai { background: var(--ai); }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 0.35rem; }

    .stack { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--grid); }
    .stack div { height: 100%; min-width: 0; }
    .stack div.critical { background: var(--sev-critical); }
    .stack div.high { background: var(--sev-high); }
    .stack div.medium { background: var(--sev-medium); }
    .stack div.low { background: var(--sev-low); }
    .legend { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-size: 0.78rem; color: var(--muted); margin: 0.4rem 0; }

    /* OWASP coverage strip: one cell per risk category, state as colored top edge plus word */
    .cov { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 4px; margin-bottom: 0.75rem; }
    .cov-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0.35rem 0.2rem; border: 1px solid rgba(31, 41, 55, 0.10); border-top-width: 4px; border-radius: 0.55rem; background: rgba(255, 255, 255, 0.85); font-size: 0.74rem; line-height: 1.2; color: var(--text); transition: background 0.15s, transform 0.15s; }
    .cov-cell:not(.na):hover { transform: translateY(-1px); }
    .cov-cell strong { font-variant-numeric: tabular-nums; }
    .cov-cell small { color: var(--muted); font-size: 0.68rem; }
    .cov-cell.fail { border-top-color: var(--fail); }
    .cov-cell.warn { border-top-color: var(--warn); }
    .cov-cell.pass { border-top-color: var(--pass); }
    .cov-cell.na { background: rgba(31, 41, 55, 0.04); border-top-color: var(--grid); color: var(--muted); cursor: default; }
    .cov-cell:not(.na):hover { background: var(--accent-soft); }
    .cov-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .meter { height: 8px; background: rgba(31, 41, 55, 0.08); border-radius: 4px; overflow: hidden; }
    .meter div { height: 100%; background: var(--accent-gradient); border-radius: 4px; transition: width 0.3s ease; }
    .meter div.good { background: var(--pass); }
    .meter div.warnfill { background: var(--warn); }
    .meter div.bad { background: var(--fail); }
    .meter-row { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 0.75rem; align-items: center; font-size: 0.85rem; margin-bottom: 0.45rem; }
    .meter-row .meter { grid-column: 1 / -1; }
    .meter-row .val { font-variant-numeric: tabular-nums; color: var(--muted); }

    svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
    svg.chart text { font-family: inherit; font-size: 11px; fill: var(--text); }
    svg.chart text.muted { fill: var(--muted); }
    svg.chart rect.mark { transition: opacity 0.1s; }
    svg.chart rect.mark:hover, svg.chart rect.mark:focus { opacity: 0.8; outline: none; }
    .arc-wrap { display: flex; align-items: center; gap: 1rem; }
    .arc-wrap svg { width: 110px; height: 110px; flex: none; }
    .arc-wrap .arc-text { font-size: 0.85rem; color: var(--muted); }
    .arc-wrap .arc-text strong { display: block; font-size: 1.4rem; color: var(--text); }

    details.tbl-details { margin-top: 0.5rem; font-size: 0.8rem; }
    details.tbl-details summary { color: var(--muted); cursor: pointer; }
    details.tbl-details table { margin-top: 0.4rem; }

    /* ---------- Tables ---------- */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    caption { text-align: left; font-size: 0.8rem; color: var(--muted); padding-bottom: 0.4rem; }
    th, td { text-align: left; padding: 0.5rem 0.55rem; border-bottom: 1px solid rgba(31, 41, 55, 0.08); vertical-align: top; }
    th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
    th button { background: none; border: none; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
    th button::after { content: " \2195"; opacity: 0.4; }
    th[aria-sort="ascending"] button::after { content: " \2191"; opacity: 1; }
    th[aria-sort="descending"] button::after { content: " \2193"; opacity: 1; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    th.num { text-align: right; }
    tbody tr.row-btn { cursor: pointer; transition: background 0.12s; }
    tbody tr.row-btn:hover { background: var(--hover); }
    tbody tr.row-btn:focus-visible { outline-offset: -2px; }
    td .status { white-space: nowrap; }
    td.title-cell { min-width: 16rem; }
    td.id-cell { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .id-chip {
      display: inline-block;
      margin: 0 0.2rem 0.2rem 0;
      padding: 0.08rem 0.5rem;
      border: 1px solid rgba(31, 41, 55, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      transition: background 0.12s, border-color 0.12s;
    }
    button.id-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
    .empty { color: var(--muted); text-align: center; padding: 1.25rem !important; }
    .toplist { list-style: none; margin: 0; padding: 0; }
    .toplist li { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.35rem 0; border-bottom: 1px solid var(--grid); font-size: 0.85rem; }
    .toplist li:last-child { border-bottom: none; }
    .toplist .who { color: var(--muted); font-size: 0.75rem; margin-left: auto; white-space: nowrap; }
    .toplist button { background: none; border: none; padding: 0; text-align: left; text-decoration: underline dotted; }

    .seg { display: inline-flex; gap: 0.15rem; padding: 0.2rem; border: 1px solid rgba(31, 41, 55, 0.10); border-radius: 999px; background: rgba(255, 255, 255, 0.7); margin-bottom: 0.75rem; }
    .seg button { padding: 0.3rem 0.8rem; border: none; border-radius: 999px; background: transparent; font-size: 0.85rem; color: var(--muted); transition: background 0.15s, color 0.15s; }
    .seg button[aria-pressed="true"] { background: var(--panel-solid); color: var(--text); font-weight: 600; box-shadow: 0 2px 8px -2px rgba(30, 41, 59, 0.25); }

    /* ---------- Drawer ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .drawer {
      position: fixed;
      top: 0.75rem; right: 0.75rem; bottom: 0.75rem;
      width: min(520px, calc(100vw - 1.5rem));
      background: var(--panel-strong);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(17, 24, 39, 0.45);
      padding: 1.4rem 1.6rem;
      overflow-y: auto;
    }
    .drawer[hidden], .backdrop[hidden] { display: none; }
    .drawer header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 0.75rem; }
    .drawer h2 { font-size: 1.1rem; letter-spacing: -0.01em; }
    .drawer .close { border: 1px solid rgba(31, 41, 55, 0.12); background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 0.3rem 0.8rem; }
    .drawer .close:hover { background: var(--accent-soft); border-color: var(--accent); }
    .drawer .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
    .drawer .badge { background: rgba(255, 255, 255, 0.85); border-color: rgba(31, 41, 55, 0.12); }
    .drawer h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0.9rem 0 0.3rem; }
    .drawer p, .drawer li { font-size: 0.9rem; margin: 0.2rem 0; }
    .drawer ol { padding-left: 1.2rem; margin: 0.2rem 0; }
    .drawer dl { margin: 0; font-size: 0.85rem; }
    .drawer dt { font-weight: 600; margin-top: 0.4rem; }
    .drawer dd { margin: 0 0 0 0; color: var(--muted); }

    /* ---------- Tooltip ---------- */
    .tooltip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      background: rgba(17, 24, 39, 0.88);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 0.4rem 0.65rem;
      border-radius: 0.6rem;
      font-size: 0.78rem;
      max-width: 260px;
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .tooltip strong { font-size: 0.9rem; }
    .tooltip[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Security Posture Dashboard</h1>
      <div class="meta">
        <span class="badge">Sample data - Contoso</span>
        <span>Entra ID, Azure resources, Microsoft Defender and AI &amp; Agents mapped to MCSB, CIS Azure v3.0, CIS M365 v4 and the OWASP AI Top 10 lists</span>
        <span id="assessed"></span>
      </div>
    </div>
    <div class="hero">
      <div class="label">Overall posture</div>
      <div class="num"><span id="posture">0</span><small>/100</small></div>
      <div class="label" style="text-transform:none;letter-spacing:0" id="posture-sub"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Dashboard sections" id="tabs"></nav>

  <section class="filters" role="search" aria-label="Filters">
    <label>Domain
      <select id="f-domain">
        <option value="all">All</option>
        <option value="entra">Entra ID</option>
        <option value="azure">Azure resources</option>
        <option value="defender">Defender</option>

    }
    function renderCoverageStrip(fw, findings) {
      const cov = coverage(fw, findings);
      const strip = el('div', { class: 'cov', role: 'list', 'aria-label': `${fw.long} coverage` });
      for (const { id, c } of cov.cells) {
        const st = c ? c.state : 'na', word = c ? STATUS_LABEL[c.state] : 'Not assessed', name = CONTROL_NAMES[id] || '';
        const n = c ? c.findings.length : 0;
        strip.append(el('button', {
          type: 'button', class: 'cov-cell ' + st, role: 'listitem', disabled: c ? null : true,
          title: `${id} ${name}: ${word}${c ? ` (${n} finding${n === 1 ? '' : 's'})` : ''}`,
          'aria-label': `${id} ${name}: ${word}${c ? `, ${n} findings. Filter by this category.` : '.'}`,
          onclick: () => { state.filters.framework = fw.key; state.filters.control = id; render(); },
        }, el('strong', { text: id }), el('small', { text: word })));
      }
      return el('div', {},
        el('p', { class: 'note', style: 'margin:0 0 .4rem' }, el('strong', { text: fw.long }), `: ${cov.assessed} of ${cov.total} risk categories assessed, ${cov.failing} with open fails`),
        strip);
    }
    function renderOwaspCoverageCard(findings, { compact = false } = {}) {
      const card = el('article', { class: 'card', style: compact ? null : 'margin-bottom:1rem' },
        el('h3', {}, 'AI threat coverage (OWASP)', el('span', { class: 'sub', text: 'Risk categories referenced by findings in the current filter. A passing cell means the mapped controls pass, not that the risk is absent.' })));
      for (const fw of TAXONOMIES) card.append(renderCoverageStrip(fw, findings));
      card.append(compact
        ? el('p', { class: 'note' }, el('button', { type: 'button', class: 'btn-ghost', text: 'Open Compliance mapping', onclick: () => setTab('compliance') }))
        : el('p', { class: 'note', text: 'OWASP Top 10 lists describe risk categories rather than controls, so they are shown as coverage and are excluded from the framework rollup percentages above. Click a cell to filter every tab by that category.' }));
      return card;
    }
    function renderAgentsCard() {
      const { key, dir } = state.agentSort;
      const rows = AGENTS.slice().sort((a, b) => {
        const r = key === 'risk' ? SEV_RANK[a.risk] - SEV_RANK[b.risk] : typeof a[key] === 'number' ? a[key] - b[key] : String(a[key]).localeCompare(String(b[key]));
        return dir === 'asc' ? r : -r;
      });
      const cols = [
        { key: 'name', label: 'Agent' }, { key: 'platform', label: 'Platform' }, { key: 'owner', label: 'Owner' }, { key: 'authMode', label: 'Auth mode' },
        { key: 'connectors', label: 'Connectors', num: true }, { key: 'sharing', label: 'Sharing' }, { key: 'risk', label: 'Risk' }, { key: 'findingIds', label: 'Findings', nosort: true },
      ];
      const a = STATS.ai;
      const table = el('table', {}, el('caption', { text: `Sortable. Sample of 10 agents out of ${a.agentIdentities} Entra agent identities across Copilot Studio, Foundry Agent Service and custom agents.` }),
        el('thead', {}, el('tr', {}, cols.map(c => el('th', { scope: 'col', class: c.num ? 'num' : null, 'aria-sort': c.nosort ? null : key === c.key ? (dir === 'asc' ? 'ascending' : 'descending') : 'none' },
          c.nosort ? c.label : el('button', { type: 'button', text: c.label, onclick: () => { state.agentSort = { key: c.key, dir: key === c.key && dir === 'asc' ? 'desc' : 'asc' }; render(); } }))))),
        el('tbody', {}, rows.map(g => el('tr', {},
          el('td', { class: 'title-cell', style: 'min-width:10rem', text: g.name }), el('td', { text: g.platform }), el('td', { text: g.owner }), el('td', { text: g.authMode }),
          el('td', { class: 'num', text: fmt(g.connectors) }), el('td', { text: g.sharing }), el('td', {}, dot(g.risk, cap(g.risk))),
          el('td', {}, g.findingIds.length ? g.findingIds.map(id => el('button', { type: 'button', class: 'id-chip', text: id, title: (FINDINGS.find(f => f.id === id) || {}).title || id, 'aria-label': `${id}: open details.`, onclick: e => openDrawer(id, e.currentTarget) })) : el('span', { class: 'note', style: 'margin:0', text: '—' }))))));
      return el('article', { class: 'card span-2' },
        el('h3', {}, 'Agent inventory', el('span', { class: 'sub', text: 'Owner, authentication, connector count and sharing scope drive the risk rating. Finding chips open the related detail.' })),
        el('div', { class: 'tbl-wrap' }, table));
    }

    /* =========================================================
       RENDER: Findings table
       ========================================================= */
    const FINDING_COLS = [
      { key: 'id', label: 'ID' }, { key: 'title', label: 'Title' }, { key: 'category', label: 'Category' },
      { key: 'severity', label: 'Severity' }, { key: 'status', label: 'Status' }, { key: 'affected', label: 'Affected', num: true },
      { key: 'source', label: 'Source' }, { key: 'mcsb', label: 'MCSB' }, { key: 'cisAzure', label: 'CIS Azure' }, { key: 'cisM365', label: 'CIS M365' }, { key: 'detected', label: 'Detected' },
    ];
    function compareFindings(a, b, key) {
      if (key === 'severity') return SEV_RANK[a.severity] - SEV_RANK[b.severity] || b.affected - a.affected;
      if (key === 'status') return ['fail', 'warn', 'pass'].indexOf(a.status) - ['fail', 'warn', 'pass'].indexOf(b.status);
      if (key === 'affected') return a.affected - b.affected;
      if (key === 'aiFrameworks') return naturalCompare(a.owaspLlm[0] || a.owaspAgentic[0] || '~', b.owaspLlm[0] || b.owaspAgentic[0] || '~');
      if (Array.isArray(a[key])) return naturalCompare(a[key][0] || '~', b[key][0] || '~');
      return String(a[key]).localeCompare(String(b[key]));
    }
    function controlChips(ids, fwKey) {
      if (!ids.length) return el('span', { class: 'note', style: 'margin:0', text: '—' });
      return el('span', {}, ids.map(id => el('button', {
        type: 'button', class: 'id-chip', title: CONTROL_NAMES[id] || id, 'aria-label': `${FRAMEWORKS[fwKey].label} ${id}: ${CONTROL_NAMES[id] || ''}. Filter by this control.`,
        text: id, onclick: e => { e.stopPropagation(); state.filters.framework = fwKey; state.filters.control = id; render(); },
      })));
    }
    function aiChips(f) {
      if (!f.owaspLlm.length && !f.owaspAgentic.length) return el('span', { class: 'note', style: 'margin:0', text: '—' });
      return el('span', {}, f.owaspLlm.length ? controlChips(f.owaspLlm, 'owaspLlm') : null, f.owaspAgentic.length ? controlChips(f.owaspAgentic, 'owaspAgentic') : null);
    }
    // Column sets: domain tabs show the 11 benchmark columns; the AI tab swaps the always-empty CIS Azure column for a combined
    // "AI frameworks" column; the compliance cross-reference shows every mapping column plus Domain.
    function renderFindingsTable(findings, { showDomain = false, domain = null } = {}) {
      const { key, dir } = state.sort;
      const rows = findings.slice().sort((a, b) => { const r = compareFindings(a, b, key); return dir === 'asc' ? r : -r; });
      let cols = FINDING_COLS;
      if (domain === 'ai') cols = FINDING_COLS.filter(c => c.key !== 'cisAzure').flatMap(c => c.key === 'cisM365' ? [c, { key: 'aiFrameworks', label: 'AI frameworks' }] : [c]);
      if (showDomain) cols = [FINDING_COLS[0], { key: 'domain', label: 'Domain' }, ...FINDING_COLS.slice(1, -1), ...TAXONOMIES.map(fw => ({ key: fw.key, label: fw.label })), FINDING_COLS[FINDING_COLS.length - 1]];
      const table = el('table', {},
        el('thead', {}, el('tr', {}, cols.map(c => el('th', { scope: 'col', class: c.num ? 'num' : null, 'aria-sort': key === c.key ? (dir === 'asc' ? 'ascending' : 'descending') : 'none' },
          el('button', { type: 'button', text: c.label, onclick: () => { state.sort = { key: c.key, dir: key === c.key && dir === 'asc' ? 'desc' : 'asc' }; render(); } }))))),
        el('tbody', {}, rows.length ? rows.map(f => el('tr', {
          class: 'row-btn', tabindex: '0', 'aria-label': `${f.id} ${f.title}. Open details.`,
          onclick: e => openDrawer(f.id, e.currentTarget), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(f.id, e.currentTarget); } },
        }, cols.map(c => {
          if (c.key === 'severity') return el('td', {}, dot(f.severity, cap(f.severity)));
          if (c.key === 'status') return el('td', {}, dot(f.status, STATUS_LABEL[f.status]));
          if (c.key === 'affected') return el('td', { class: 'num', text: f.affected ? `${fmt(f.affected)} ${f.affectedUnit}` : '—' });
          if (c.key === 'domain') return el('td', {}, dot(f.domain, DOMAINS[f.domain]));
          if (c.key === 'title') return el('td', { class: 'title-cell', text: f.title });
          if (c.key === 'id') return el('td', { class: 'id-cell', text: f.id });
          if (c.key === 'aiFrameworks') return el('td', {}, aiChips(f));
          if (FRAMEWORKS[c.key]) return el('td', {}, controlChips(f[c.key], c.key));
          return el('td', { text: f[c.key] });
        }))) : el('tr', {}, el('td', { colspan: cols.length, class: 'empty', text: 'No findings match the current filters.' }))));
      return el('div', { class: 'tbl-wrap' }, table);
    }

    /* =========================================================
       RENDER: Compliance mapping
       ========================================================= */
    function renderCompliance(panel, findings) {
      const cards = el('div', { class: 'grid' });
      for (const fw of BENCHMARKS) {
        const r = rollup(fw.key, findings);
        cards.append(el('article', { class: 'card kpi' },
          el('div', { class: 'label', text: fw.long }),
          el('div', { class: 'value' }, `${r.pct}%`, el('small', { text: ` ${r.passed} of ${r.total} controls passing` })),
          el('div', { class: 'meter', role: 'img', 'aria-label': `${fw.label}: ${r.pct} percent passing` }, el('div', { class: toneFor(r.pct), style: `width:${r.pct}%` })),
          el('div', { class: 'delta', text: `${r.failed} failing · ${r.warned} partial` })));
      }
      const s = DFC_CIS.summary, assessed = s.passed + s.failed;
      cards.append(el('article', { class: 'card kpi' },
        el('div', { class: 'label', text: `${DFC_CIS.standard} (as reported by Defender for Cloud)` }),
        el('div', { class: 'value' }, `${pct(s.passed, assessed)}%`, el('small', { text: ` ${s.passed} of ${assessed} assessed passing` })),
        el('div', { class: 'meter', role: 'img', 'aria-label': `Defender for Cloud CIS: ${pct(s.passed, assessed)} percent passing` }, el('div', { class: toneFor(pct(s.passed, assessed)), style: `width:${pct(s.passed, assessed)}%` })),
        el('div', { class: 'delta', text: `${s.failed} failed · ${s.skipped} skipped · ${s.unsupported} unsupported` })));
      panel.append(cards);
      panel.append(renderOwaspCoverageCard(findings));

      const card = el('article', { class: 'card' });
      const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'View' },
        el('button', { type: 'button', 'aria-pressed': String(state.complianceView === 'finding'), text: 'By finding', onclick: () => { state.complianceView = 'finding'; render(); } }),
        el('button', { type: 'button', 'aria-pressed': String(state.complianceView === 'control'), text: 'By control', onclick: () => { state.complianceView = 'control'; render(); } }));
      if (state.complianceView === 'finding') {
        card.append(el('h3', {}, 'Cross-reference: findings to controls', el('span', { class: 'sub', text: 'Click a control chip to filter every tab by that control' })), seg);
        card.append(renderFindingsTable(findings, { showDomain: true }));
      } else {
        const fwSeg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Framework', style: 'margin-left:.75rem' }, Object.values(FRAMEWORKS).map(fw =>
          el('button', { type: 'button', 'aria-pressed': String(state.complianceFw === fw.key), text: fw.label, onclick: () => { state.complianceFw = fw.key; render(); } })));
        const fw = FRAMEWORKS[state.complianceFw];
        const r = rollup(fw.key, findings);
        card.append(el('h3', {}, `Controls: ${fw.long}`, el('span', { class: 'sub', text: `${r.passed} passing, ${r.warned} partial, ${r.failed} failing of ${r.total} referenced controls` })), el('div', {}, seg, fwSeg));
        const table = el('table', {},
          el('thead', {}, el('tr', {}, ['Control', 'Title', 'State', 'Worst severity', 'Findings', 'Mapped findings'].map((h, i) => el('th', { scope: 'col', class: i === 4 ? 'num' : null, text: h })))),
          el('tbody', {}, r.controls.length ? r.controls.map(c => el('tr', {},
            el('td', { text: c.id }), el('td', { text: CONTROL_NAMES[c.id] || '' }), el('td', {}, dot(c.state, STATUS_LABEL[c.state])),
            el('td', {}, c.state === 'pass' ? '—' : dot(c.worst, cap(c.worst))), el('td', { class: 'num', text: c.findings.length }),
            el('td', {}, c.findings.map((f, i) => [i ? ' · ' : null, el('button', { type: 'button', class: 'id-chip', text: f.id, title: f.title, 'aria-label': `${f.id}: ${f.title}. Open details.`, onclick: e => openDrawer(f.id, e.currentTarget) })]))))
            : el('tr', {}, el('td', { colspan: 6, class: 'empty', text: 'No controls referenced by the current filter.' }))));
        card.append(el('div', { class: 'tbl-wrap' }, table));
      }
      panel.append(card);

      const dfcCard = el('article', { class: 'card' },
        el('h3', {}, `${DFC_CIS.standard}: control detail`, el('span', { class: 'sub', text: 'As reported by Defender for Cloud regulatory compliance. Numbering follows the version Defender ships, not v3.0 used in the mapping above.' })));
      dfcCard.append(el('div', { class: 'tbl-wrap' }, el('table', {},
        el('thead', {}, el('tr', {}, ['Control', 'Title', 'State', 'Passed', 'Failed'].map((h, i) => el('th', { scope: 'col', class: i >= 3 ? 'num' : null, text: h })))),
        el('tbody', {}, DFC_CIS.controls.slice().sort((a, b) => naturalCompare(a.control, b.control)).map(c => el('tr', {},
          el('td', { text: c.control }), el('td', { text: c.title }),
          el('td', {}, dot(c.state === 'Passed' ? 'pass' : c.state === 'Failed' ? 'fail' : 'low', c.state)),
          el('td', { class: 'num', text: fmt(c.passed) }), el('td', { class: 'num', text: fmt(c.failed) })))))));
      panel.append(dfcCard);
    }

    /* =========================================================
       DRAWER
       ========================================================= */
    const drawer = $('#drawer'), backdrop = $('#backdrop');
    function openDrawer(id, returnEl) {
      const f = FINDINGS.find(x => x.id === id);
      if (!f) return;
      state.drawerId = id;
      state.drawerReturnEl = returnEl || document.activeElement;
      const mapping = el('dl', {});
      for (const fw of Object.values(FRAMEWORKS)) {
        if (fw.taxonomy && !f[fw.key].length) continue; // taxonomies only appear when the finding maps to them
        mapping.append(el('dt', { text: fw.long }));
        if (!f[fw.key].length) mapping.append(el('dd', { text: 'Not mapped' }));
        for (const cid of f[fw.key]) mapping.append(el('dd', {}, el('strong', { text: cid }), ' ', CONTROL_NAMES[cid] || ''));
      }
      const steps = f.remediation.split(/(?<=\.)\s+(?=[A-Z])/).filter(Boolean);
      drawer.replaceChildren(...[
        el('header', {}, el('h2', { id: 'drawer-title', text: `${f.id} · ${f.title}` }), el('button', { type: 'button', class: 'close', 'aria-label': 'Close details', text: 'Close', onclick: closeDrawer })),
        el('div', { class: 'badges' }, el('span', { class: 'badge' }, dot(f.domain, DOMAINS[f.domain])), el('span', { class: 'badge' }, dot(f.severity, cap(f.severity))),
          el('span', { class: 'badge' }, dot(f.status, STATUS_LABEL[f.status])), el('span', { class: 'badge', text: f.source }), el('span', { class: 'badge', text: f.category })),
        el('h4', { text: 'Scope' }), el('p', { text: f.scope }),
        el('h4', { text: 'Affected' }), el('p', { text: f.affected ? `${fmt(f.affected)} ${f.affectedUnit}` : 'None' }),
        el('h4', { text: 'Description' }), el('p', { text: f.description }),
        el('h4', { text: 'Remediation' }), steps.length > 1 ? el('ol', {}, steps.map(s => el('li', { text: s }))) : el('p', { text: f.remediation }),
        el('h4', { text: 'Framework mapping' }), mapping,
        f.atlas.length ? [el('h4', { text: 'Related threat techniques (MITRE ATLAS)' }), el('ul', { style: 'padding-left:1.2rem;margin:0.2rem 0' }, f.atlas.map(t => el('li', {}, el('strong', { text: t }), ' ', CONTROL_NAMES[t] || '')))] : null,
        el('h4', { text: 'Detected' }), el('p', { text: f.detected })].flat(Infinity).filter(Boolean));
      drawer.hidden = false; backdrop.hidden = false;
      drawer.focus();
    }
    function closeDrawer() {
      drawer.hidden = true; backdrop.hidden = true;
      state.drawerId = null;
      if (state.drawerReturnEl && document.body.contains(state.drawerReturnEl)) state.drawerReturnEl.focus();
    }
    backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

    /* =========================================================
       FILTER EVENTS
       ========================================================= */
    $('#f-domain').addEventListener('change', e => { state.filters.domain = e.target.value; render(); });
    $('#f-status').addEventListener('change', e => { state.filters.status = e.target.value; render(); });
    $('#f-framework').addEventListener('change', e => { state.filters.framework = e.target.value; render(); });
    $('#f-control').addEventListener('input', e => { state.filters.control = e.target.value; render(); });
    $('#f-search').addEventListener('input', e => { state.filters.q = e.target.value; render(); });
    $('#f-reset').addEventListener('click', () => {
      state.filters = { domain: 'all', severities: new Set(SEVERITIES), status: 'all', framework: 'all', control: '', q: '' };
      state.cveFilters = { exploitOnly: false, criticalOnly: false };
      render();
    });

    const initialTab = location.hash.slice(1);
    if (TABS.some(t => t.id === initialTab)) state.tab = initialTab;
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (TABS.some(t => t.id === id) && id !== state.tab) setTab(id); });
    render();
  </script>
</body>
</html>
