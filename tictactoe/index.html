<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --panel: #ffffff;
      --cell: #e8eef5;
      --cell-hover: #d9e2ec;
      --text: #1f2937;
      --muted: #6b7280;
      --x: #2563eb;
      --o: #e11d48;
      --win: #16a34a;
      --accent: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      background: var(--panel);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
      width: min(92vw, 380px);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
      letter-spacing: 0.05em;
    }

    .modes {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .modes button {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid var(--cell);
      border-radius: 0.5rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modes button.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(124, 58, 237, 0.1);
    }

    .status {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .status .x { color: var(--x); font-weight: 700; }
    .status .o { color: var(--o); font-weight: 700; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 0.75rem;
      background: var(--cell);
      color: var(--text);
      font-size: 2.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:hover:not(:disabled) { background: var(--cell-hover); }
    .cell:active:not(:disabled) { transform: scale(0.96); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      background: rgba(22, 163, 74, 0.15);
      box-shadow: inset 0 0 0 2px var(--win);
    }

    .scores {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }

    .scores div { display: flex; flex-direction: column; gap: 0.15rem; }
    .scores span:first-child { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .scores span:last-child { font-size: 1.4rem; font-weight: 700; }
    .scores .x span:last-child { color: var(--x); }
    .scores .o span:last-child { color: var(--o); }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .actions button:hover { filter: brightness(1.15); }
    #new-round { background: var(--accent); color: white; }
    #reset-scores { background: var(--cell); color: var(--text); }
  </style>
</head>
<body>
  <main class="app">
    <h1>Tic-Tac-Toe</h1>

    <div class="modes" role="group" aria-label="Game mode">
      <button id="mode-pvp" class="active" type="button">2 Players</button>
      <button id="mode-cpu" type="button">vs Computer</button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>

    <div class="scores">
      <div class="x"><span>X wins</span><span id="score-x">0</span></div>
      <div><span>Draws</span><span id="score-draw">0</span></div>
      <div class="o"><span>O wins</span><span id="score-o">0</span></div>
    </div>

    <div class="actions">
      <button id="new-round" type="button">New Round</button>
      <button id="reset-scores" type="button">Reset Scores</button>
    </div>
  </main>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6],
    ];

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const scoreEls = {
      X: document.getElementById('score-x'),
      O: document.getElementById('score-o'),
      draw: document.getElementById('score-draw'),
    };
    const modeButtons = {
      pvp: document.getElementById('mode-pvp'),
      cpu: document.getElementById('mode-cpu'),
    };

    let board, current, gameOver, vsComputer = false;
    let startingPlayer = 'X';
    const scores = { X: 0, O: 0, draw: 0 };
    const cells = [];

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', `Cell ${i + 1}`);
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
      cells.push(cell);
    }

    function newRound() {
      board = Array(9).fill(null);
      current = startingPlayer;
      gameOver = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className = 'cell';
        c.disabled = false;
      });
      updateStatus();
      if (vsComputer && current === 'O') setTimeout(computerMove, 300);
    }

    function handleMove(i) {
      if (gameOver || board[i]) return;
      if (vsComputer && current === 'O') return;
      place(i);
      if (!gameOver && vsComputer) setTimeout(computerMove, 350);
    }

    function place(i) {
      board[i] = current;
      cells[i].textContent = current;
      cells[i].classList.add(current.toLowerCase());
      cells[i].disabled = true;

      const line = winningLine(board);
      if (line) {
        endGame(current, line);
        return;
      }
      if (board.every(Boolean)) {
        endGame(null);
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      updateStatus();
    }

    function endGame(winner, line) {
      gameOver = true;
      cells.forEach(c => (c.disabled = true));
      if (winner) {
        line.forEach(i => cells[i].classList.add('win'));
        scores[winner]++;
        scoreEls[winner].textContent = scores[winner];
        statusEl.innerHTML = `<span class="${winner.toLowerCase()}">${winner}</span> wins!`;
      } else {
        scores.draw++;
        scoreEls.draw.textContent = scores.draw;
        statusEl.textContent = "It's a draw!";
      }
      startingPlayer = startingPlayer === 'X' ? 'O' : 'X';
    }

    function updateStatus() {
      const label = vsComputer && current === 'O' ? 'Computer is thinking…' : `${current}'s turn`;
      statusEl.innerHTML = `<span class="${current.toLowerCase()}">${label}</span>`;
    }

    function winningLine(b) {
      return WIN_LINES.find(([a, c, d]) => b[a] && b[a] === b[c] && b[a] === b[d]) || null;
    }

    // Minimax: the computer (O) plays perfectly.
    function computerMove() {
      if (gameOver) return;
      let bestScore = -Infinity;
      let bestMove = null;
      for (let i = 0; i < 9; i++) {
        if (board[i]) continue;
        board[i] = 'O';
        const score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }
      place(bestMove);
    }

    function minimax(b, depth, isMaximizing) {
      const line = winningLine(b);
      if (line) return b[line[0]] === 'O' ? 10 - depth : depth - 10;
      if (b.every(Boolean)) return 0;

      let best = isMaximizing ? -Infinity : Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i]) continue;
        b[i] = isMaximizing ? 'O' : 'X';
        const score = minimax(b, depth + 1, !isMaximizing);
        b[i] = null;
        best = isMaximizing ? Math.max(best, score) : Math.min(best, score);
      }
      return best;
    }

    function setMode(cpu) {
      vsComputer = cpu;
      modeButtons.pvp.classList.toggle('active', !cpu);
      modeButtons.cpu.classList.toggle('active', cpu);
      resetScores();
    }

    function resetScores() {
      scores.X = scores.O = scores.draw = 0;
      Object.values(scoreEls).forEach(el => (el.textContent = '0'));
      startingPlayer = 'X';
      newRound();
    }

    modeButtons.pvp.addEventListener('click', () => setMode(false));
    modeButtons.cpu.addEventListener('click', () => setMode(true));
    document.getElementById('new-round').addEventListener('click', newRound);
    document.getElementById('reset-scores').addEventListener('click', resetScores);

    newRound();
  </script>
</body>
</html>
